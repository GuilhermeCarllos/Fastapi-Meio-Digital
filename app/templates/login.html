<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Meio Digital{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/projetofinal22/app/static/css/style.css">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
    <div class="container vh-100 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="modal-title mb-0">Login</h2>
                    </div>
                    <div class="card-body">
                        <div id="error-message" class="alert alert-danger alert-dismissible fade d-none" role="alert">
                            <span id="error-text"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div id="success-message" class="alert alert-success alert-dismissible fade d-none" role="alert">
                            <span id="success-text"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="button" id="register-btn" class="btn btn-secondary me-2">Fazer Cadastro</button>
                                <button type="submit" class="btn btn-primary">Entrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
    document.getElementById("login-form").addEventListener("submit", async function (event) {
        event.preventDefault();
    
        const errorMessage = document.getElementById("error-message");
        const successMessage = document.getElementById("success-message");
        errorMessage.classList.add("d-none");
        successMessage.classList.add("d-none");
    
        const formData = new FormData(this);
    
        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                body: formData
            });
    
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || "Erro ao fazer login");
            }
    
            const result = await response.json();
            localStorage.setItem("access_token", result.access_token);
    
            const successText = document.getElementById("success-text");
            successText.textContent = "Login bem-sucedido! Redirecionando...";
            successMessage.classList.remove("d-none");
            successMessage.classList.add("show");
    
            // Carrega a página de relatórios dinamicamente com o token
            const token = result.access_token;
            const reportResponse = await fetch("/api/report/report", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "text/html"
                }
            });
    
            if (reportResponse.ok) {
                const html = await reportResponse.text();
                document.open();
                document.write(html);
                document.close();
                history.pushState({}, "", "/api/report/report");
            } else {
                throw new Error("Erro ao carregar a página de relatórios");
            }
        } catch (error) {
            const errorText = document.getElementById("error-text");
            errorText.textContent = error.message;
            errorMessage.classList.remove("d-none");
            errorMessage.classList.add("show");
        }
    });

    // Evento para o botão "Fazer Cadastro"
    document.getElementById("register-btn").addEventListener("click", function () {
        window.location.href = "/api/auth/register";
    });
    </script>
    
</body>
</html>
